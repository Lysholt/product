<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product Management Process Map — SaaS</title>
<style>
  :root {
    --bg-0: #070b16;
    --bg-1: #0b1124;
    --panel: rgba(17, 24, 45, 0.82);
    --panel-solid: #111a30;
    --stroke: rgba(148, 163, 184, 0.16);
    --stroke-strong: rgba(148, 163, 184, 0.30);
    --text: #e8edf7;
    --text-dim: #93a0bb;
    --text-faint: #64728f;
    --c-strategy:   #6366f1;
    --c-discovery:  #06b6d4;
    --c-planning:   #10b981;
    --c-definition: #f59e0b;
    --c-delivery:   #f97316;
    --c-launch:     #ec4899;
    --c-growth:     #8b5cf6;
    --c-measure:    #3b82f6;
    --c-governance: #64748b;
    --ai-assistive:  #2dd4bf;
    --ai-augmented:  #a78bfa;
    --ai-autonomous: #f472b6;
    --shadow: 0 18px 40px -18px rgba(0,0,0,0.75);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background:
      radial-gradient(1200px 700px at 18% -10%, rgba(99,102,241,0.18), transparent 55%),
      radial-gradient(1000px 600px at 95% 110%, rgba(59,130,246,0.16), transparent 50%),
      linear-gradient(180deg, var(--bg-1), var(--bg-0));
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== Top bar ===== */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 40;
    display: flex; align-items: flex-start; gap: 18px;
    padding: 14px 22px;
    background: linear-gradient(180deg, rgba(7,11,22,0.92), rgba(7,11,22,0.0));
    pointer-events: none;
  }
  .brand { pointer-events: auto; }
  .brand h1 {
    font-size: 17px; font-weight: 700; letter-spacing: 0.2px; margin: 0;
    display: flex; align-items: center; gap: 10px;
  }
  .brand .dot {
    width: 11px; height: 11px; border-radius: 50%;
    background: conic-gradient(from 0deg, var(--c-strategy), var(--c-discovery), var(--c-planning), var(--c-definition), var(--c-delivery), var(--c-launch), var(--c-growth), var(--c-measure), var(--c-strategy));
    box-shadow: 0 0 14px rgba(99,102,241,0.7);
  }
  .brand p { margin: 3px 0 0 21px; font-size: 12.5px; color: var(--text-dim); }
  .toolbar { margin-left: auto; pointer-events: auto; display: flex; gap: 8px; align-items: center; }
  .tbtn {
    height: 34px; padding: 0 13px; border-radius: 9px; border: 1px solid var(--stroke);
    background: var(--panel); backdrop-filter: blur(12px); color: var(--text); font-size: 12.5px;
    font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .tbtn:hover { background: rgba(148,163,184,0.16); border-color: var(--stroke-strong); }
  .tbtn:active { transform: translateY(1px); }
  .tbtn.primary { background: linear-gradient(180deg, #6d6ff5, #5457e0); border-color: #6366f1; color: #fff; box-shadow: 0 8px 22px -10px rgba(99,102,241,0.9); }
  .tbtn.primary:hover { background: linear-gradient(180deg, #7c7ef7, #6164e6); }
  .tbtn.subtle { color: var(--text-dim); font-weight: 500; }

  /* ===== Legend ===== */
  .legend {
    position: fixed; top: 64px; left: 22px; z-index: 35;
    background: var(--panel); backdrop-filter: blur(14px);
    border: 1px solid var(--stroke); border-radius: 14px;
    padding: 12px; width: 210px; box-shadow: var(--shadow);
    max-height: calc(100vh - 160px); overflow-y: auto;
  }
  .legend h3 { margin: 2px 4px 9px; font-size: 11px; letter-spacing: 0.8px; text-transform: uppercase; color: var(--text-faint); font-weight: 700; }
  .legend .item {
    display: flex; align-items: center; gap: 9px; padding: 6px 8px;
    border-radius: 9px; cursor: pointer; font-size: 12.5px; color: var(--text-dim);
    transition: background 0.15s, color 0.15s;
  }
  .legend .item:hover { background: rgba(148,163,184,0.08); color: var(--text); }
  .legend .item.active { background: rgba(148,163,184,0.12); color: var(--text); }
  .legend .swatch { width: 11px; height: 11px; border-radius: 3px; flex: none; box-shadow: 0 0 8px currentColor; }
  .legend .reset { margin-top: 6px; font-size: 11.5px; color: var(--text-faint); text-align: center; cursor: pointer; padding: 5px; border-radius: 8px; }
  .legend .reset:hover { color: var(--text); background: rgba(148,163,184,0.08); }
  .legend .divider { height: 1px; background: var(--stroke); margin: 11px 2px; }
  .legend .toggle {
    display: flex; align-items: center; gap: 9px; padding: 7px 8px; border-radius: 9px;
    cursor: pointer; font-size: 12.5px; color: var(--text-dim); user-select: none;
  }
  .legend .toggle:hover { background: rgba(148,163,184,0.08); color: var(--text); }
  .legend .toggle .sw {
    width: 30px; height: 17px; border-radius: 999px; background: rgba(148,163,184,0.22);
    position: relative; flex: none; transition: background 0.18s;
  }
  .legend .toggle .sw::after { content:""; position:absolute; top:2px; left:2px; width:13px; height:13px; border-radius:50%; background:#fff; transition: left 0.18s; }
  .legend .toggle.on .sw { background: var(--ai-augmented); }
  .legend .toggle.on .sw::after { left: 15px; }

  /* ===== Canvas ===== */
  #stage { position: fixed; inset: 0; overflow: hidden; cursor: grab; }
  #stage.dragging { cursor: grabbing; }
  #world {
    position: absolute; top: 0; left: 0; transform-origin: 0 0;
    background-image: radial-gradient(rgba(148,163,184,0.10) 1px, transparent 1.4px);
    background-size: 30px 30px;
  }
  #edges { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }

  /* ===== Lane / phase headers ===== */
  .lane-label {
    position: absolute; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--text-faint); font-weight: 700;
  }
  .phase-head {
    position: absolute; display: flex; flex-direction: column; gap: 3px;
    padding: 13px 16px 14px; border-radius: 14px; width: 250px;
    background:
      linear-gradient(150deg,
        color-mix(in srgb, var(--phc) 38%, var(--panel-solid)),
        color-mix(in srgb, var(--phc) 16%, var(--panel-solid)));
    border: 1px solid color-mix(in srgb, var(--phc) 60%, transparent);
    box-shadow:
      0 0 0 1px color-mix(in srgb, var(--phc) 22%, transparent),
      0 12px 28px -16px color-mix(in srgb, var(--phc) 40%, transparent),
      0 18px 40px -22px rgba(0,0,0,0.85);
  }
  .phase-head::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px;
    border-radius: 14px 14px 0 0; background: var(--phc);
    box-shadow: 0 0 7px color-mix(in srgb, var(--phc) 45%, transparent);
  }
  .phase-head .ttl { font-size: 16px; font-weight: 800; letter-spacing: 0.2px; color: #fff; }
  .phase-head .sub { font-size: 11.5px; color: color-mix(in srgb, var(--text) 80%, var(--phc)); }

  /* ===== Nodes ===== */
  .node {
    position: absolute; width: 250px; padding: 12px 14px;
    background: var(--panel); backdrop-filter: blur(8px);
    border: 1px solid var(--stroke); border-left: 3px solid var(--nc);
    border-radius: 12px; cursor: pointer;
    box-shadow: 0 10px 26px -16px rgba(0,0,0,0.8);
    transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s, opacity 0.2s;
  }
  .node:hover { transform: translateY(-3px); box-shadow: 0 18px 34px -16px rgba(0,0,0,0.85), 0 0 0 1px var(--nc); }
  .node.selected { box-shadow: 0 0 0 2px var(--nc), 0 18px 34px -14px rgba(0,0,0,0.9); transform: translateY(-3px); }
  .node.dimmed { opacity: 0.14; filter: saturate(0.4); }
  .node .ntitle { font-size: 13.5px; font-weight: 650; line-height: 1.25; padding-right: 4px; }
  .node .nmeta { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 6px; }
  .node .chip {
    font-size: 10.5px; color: var(--text-dim); background: rgba(148,163,184,0.10);
    border: 1px solid var(--stroke); border-radius: 999px; padding: 2px 8px;
  }
  .node .chip.owner { color: var(--nc); border-color: color-mix(in srgb, var(--nc) 45%, transparent); background: color-mix(in srgb, var(--nc) 12%, transparent); }
  .node.gov { width: 220px; }
  .node .ai-badge {
    position: absolute; top: 10px; right: 10px;
    font-size: 9.5px; font-weight: 700; letter-spacing: 0.3px;
    padding: 2px 7px 2px 6px; border-radius: 999px; display: inline-flex; align-items: center; gap: 3px;
    color: var(--aic); background: color-mix(in srgb, var(--aic) 16%, transparent);
    border: 1px solid color-mix(in srgb, var(--aic) 55%, transparent);
    box-shadow: 0 0 10px color-mix(in srgb, var(--aic) 35%, transparent);
  }
  .node .ntitle.has-badge { padding-right: 74px; }

  /* AI lens: recolor accents by AI level, fade non-AI */
  #world.lens .node { border-left-color: var(--stroke-strong); }
  #world.lens .node[data-ai="assistive"]  { border-left-color: var(--ai-assistive);  box-shadow: 0 0 0 1px color-mix(in srgb, var(--ai-assistive) 50%, transparent), 0 10px 26px -16px rgba(0,0,0,0.8); }
  #world.lens .node[data-ai="augmented"]  { border-left-color: var(--ai-augmented);  box-shadow: 0 0 0 1px color-mix(in srgb, var(--ai-augmented) 50%, transparent), 0 10px 26px -16px rgba(0,0,0,0.8); }
  #world.lens .node[data-ai="autonomous"] { border-left-color: var(--ai-autonomous); box-shadow: 0 0 0 1px color-mix(in srgb, var(--ai-autonomous) 55%, transparent), 0 10px 26px -16px rgba(0,0,0,0.8); }
  #world.lens .node[data-ai="none"] { opacity: 0.3; }
  #world.lens .node.dimmed { opacity: 0.1; }

  .edge { fill: none; stroke-width: 2; transition: opacity 0.2s; }
  .edge.loop { stroke-dasharray: 7 6; }
  .edge.gov { stroke-dasharray: 2 7; stroke-width: 1.6; }
  .edge.dimmed { opacity: 0.05; }

  /* ===== Controls ===== */
  .controls {
    position: fixed; bottom: 22px; left: 22px; z-index: 35;
    display: flex; gap: 8px; align-items: center;
    background: var(--panel); backdrop-filter: blur(14px);
    border: 1px solid var(--stroke); border-radius: 12px; padding: 7px; box-shadow: var(--shadow);
  }
  .controls button {
    width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--stroke);
    background: rgba(148,163,184,0.06); color: var(--text); font-size: 16px; cursor: pointer;
    display: grid; place-items: center; transition: background 0.15s, border-color 0.15s;
  }
  .controls button:hover { background: rgba(148,163,184,0.16); border-color: var(--stroke-strong); }
  .controls .zlabel { font-size: 12px; color: var(--text-dim); min-width: 46px; text-align: center; }
  .controls .sep { width: 1px; height: 24px; background: var(--stroke); }
  .controls .fit { width: auto; padding: 0 12px; font-size: 12.5px; font-weight: 600; }

  .hint {
    position: fixed; bottom: 24px; right: 22px; z-index: 35;
    font-size: 12px; color: var(--text-faint);
    background: var(--panel); border: 1px solid var(--stroke); border-radius: 10px;
    padding: 8px 12px; backdrop-filter: blur(10px);
  }
  .hint b { color: var(--text-dim); font-weight: 600; }

  /* ===== Detail panel ===== */
  .detail {
    position: fixed; top: 0; right: 0; bottom: 0; width: 384px; z-index: 50;
    background: var(--panel-solid); border-left: 1px solid var(--stroke-strong);
    box-shadow: -24px 0 60px -30px rgba(0,0,0,0.9);
    transform: translateX(100%); transition: transform 0.32s cubic-bezier(.22,.61,.36,1);
    display: flex; flex-direction: column;
  }
  .detail.open { transform: translateX(0); }
  .detail .dhead { padding: 22px 22px 16px; border-bottom: 1px solid var(--stroke); position: relative; }
  .detail .dhead::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background: var(--dc); }
  .detail .phase-tag { font-size: 11px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--dc); }
  .detail h2 { margin: 7px 0 8px; font-size: 20px; line-height: 1.25; padding-right: 30px; }
  .detail .purpose { font-size: 13.5px; color: var(--text-dim); line-height: 1.5; }
  .detail .dbody { padding: 18px 22px 30px; overflow-y: auto; }
  .detail .row { display: flex; gap: 10px; margin-bottom: 14px; }
  .detail .row .k { font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase; color: var(--text-faint); width: 78px; flex: none; padding-top: 2px; font-weight: 700; }
  .detail .row .v { font-size: 13px; color: var(--text); }
  .detail .sect { margin-top: 18px; }
  .detail .sect h4 { margin: 0 0 9px; font-size: 11px; letter-spacing: 0.7px; text-transform: uppercase; color: var(--text-faint); font-weight: 700; }
  .detail ul { margin: 0; padding-left: 0; list-style: none; display: flex; flex-direction: column; gap: 7px; }
  .detail li { font-size: 13px; color: var(--text); line-height: 1.4; padding-left: 18px; position: relative; }
  .detail li::before { content: ""; position: absolute; left: 2px; top: 7px; width: 6px; height: 6px; border-radius: 2px; background: var(--dc); }
  .detail .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .detail .tags span { font-size: 11.5px; color: var(--text-dim); background: rgba(148,163,184,0.10); border: 1px solid var(--stroke); border-radius: 7px; padding: 3px 9px; }
  .detail .close {
    position: absolute; top: 16px; right: 16px; width: 30px; height: 30px; border-radius: 8px;
    border: 1px solid var(--stroke); background: rgba(148,163,184,0.06); color: var(--text-dim);
    cursor: pointer; font-size: 17px; line-height: 1; display: grid; place-items: center;
  }
  .detail .close:hover { color: var(--text); background: rgba(148,163,184,0.16); }
  .detail .ai-card {
    margin-top: 16px; padding: 13px 14px; border-radius: 12px;
    background: color-mix(in srgb, var(--aic) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--aic) 40%, transparent);
  }
  .detail .ai-card .ai-h { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .detail .ai-card .ai-lvl { font-size: 11px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; color: var(--aic); }
  .detail .ai-card .ai-spark { color: var(--aic); }
  .detail .ai-card .ai-how { font-size: 13px; color: var(--text); line-height: 1.5; }
  .detail .ai-none { margin-top: 16px; font-size: 12.5px; color: var(--text-faint); font-style: italic; }
  .detail .actions { display: flex; gap: 8px; margin-top: 22px; }
  .detail .actions button { flex: 1; padding: 10px; border-radius: 9px; border: 1px solid var(--stroke); background: rgba(148,163,184,0.06); color: var(--text); font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .detail .actions .edit:hover { background: rgba(148,163,184,0.16); }
  .detail .actions .del { color: #fca5a5; border-color: rgba(248,113,113,0.3); }
  .detail .actions .del:hover { background: rgba(248,113,113,0.14); }
  .detail .nav { display: flex; gap: 8px; margin-top: 10px; }
  .detail .nav button { flex: 1; padding: 9px; border-radius: 9px; border: 1px solid var(--stroke); background: rgba(148,163,184,0.06); color: var(--text-dim); font-size: 12.5px; cursor: pointer; }
  .detail .nav button:hover { color: var(--text); background: rgba(148,163,184,0.16); }

  /* ===== Editor modal ===== */
  .overlay {
    position: fixed; inset: 0; z-index: 60; background: rgba(5,8,16,0.62);
    backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; padding: 28px;
  }
  .overlay.open { display: flex; }
  .modal {
    width: 560px; max-width: 100%; max-height: calc(100vh - 56px); overflow-y: auto;
    background: var(--panel-solid); border: 1px solid var(--stroke-strong); border-radius: 16px;
    box-shadow: 0 40px 90px -30px rgba(0,0,0,0.9);
  }
  .modal .mhead { padding: 20px 24px 14px; border-bottom: 1px solid var(--stroke); display: flex; align-items: center; }
  .modal .mhead h2 { margin: 0; font-size: 18px; }
  .modal .mhead .x { margin-left: auto; width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--stroke); background: rgba(148,163,184,0.06); color: var(--text-dim); cursor: pointer; font-size: 17px; }
  .modal .mhead .x:hover { color: var(--text); background: rgba(148,163,184,0.16); }
  .modal .mbody { padding: 18px 24px 8px; }
  .field { margin-bottom: 15px; }
  .field label { display: block; font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase; color: var(--text-faint); font-weight: 700; margin-bottom: 6px; }
  .field .hintline { font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--text-faint); font-size: 11px; }
  .field input, .field textarea, .field select {
    width: 100%; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--stroke);
    background: rgba(148,163,184,0.06); color: var(--text); font-size: 13px; font-family: inherit;
  }
  .field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--c-strategy); background: rgba(99,102,241,0.08); }
  .field textarea { resize: vertical; min-height: 60px; line-height: 1.45; }
  .field select[multiple] { min-height: 96px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .modal .mfoot { padding: 14px 24px 20px; display: flex; gap: 10px; align-items: center; border-top: 1px solid var(--stroke); margin-top: 6px; }
  .modal .mfoot .save { padding: 10px 18px; border-radius: 9px; border: 1px solid #6366f1; background: linear-gradient(180deg, #6d6ff5, #5457e0); color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; }
  .modal .mfoot .save:hover { background: linear-gradient(180deg, #7c7ef7, #6164e6); }
  .modal .mfoot .cancel { padding: 10px 16px; border-radius: 9px; border: 1px solid var(--stroke); background: rgba(148,163,184,0.06); color: var(--text-dim); font-size: 13px; cursor: pointer; }
  .modal .mfoot .cancel:hover { color: var(--text); }
  .modal .mfoot .del-link { margin-left: auto; color: #fca5a5; background: none; border: none; font-size: 12.5px; cursor: pointer; }
  .modal .mfoot .del-link:hover { text-decoration: underline; }
  .err { color: #fca5a5; font-size: 12px; margin-top: 4px; min-height: 14px; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); z-index: 80;
    background: var(--panel-solid); border: 1px solid var(--stroke-strong); border-radius: 10px;
    padding: 10px 16px; font-size: 13px; color: var(--text); box-shadow: var(--shadow);
    opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 760px) {
    .legend { display: none; }
    .detail { width: 100%; }
    .brand p { display: none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <h1><span class="dot"></span> Product Management Process Map</h1>
    <p>The end-to-end operating lifecycle of product management in a SaaS company</p>
  </div>
  <div class="toolbar">
    <button class="tbtn primary" id="add-node">+ Add node</button>
    <button class="tbtn subtle" id="export-btn" title="Download the map as JSON">Export</button>
    <button class="tbtn subtle" id="import-btn" title="Load a map from JSON">Import</button>
    <button class="tbtn subtle" id="reset-btn" title="Restore the default map">Reset</button>
    <input type="file" id="import-file" accept="application/json" hidden />
  </div>
</div>

<div class="legend" id="legend">
  <h3>Lifecycle phases</h3>
  <div id="legend-items"></div>
  <div class="reset" id="legend-reset">Show all phases</div>
  <div class="divider"></div>
  <h3>AI enablement</h3>
  <div id="ai-items"></div>
  <div class="toggle" id="lens-toggle"><span class="sw"></span><span>Color by AI level</span></div>
</div>

<div id="stage">
  <div id="world">
    <svg id="edges"><defs></defs></svg>
  </div>
</div>

<div class="controls">
  <button id="zoom-out" title="Zoom out">−</button>
  <span class="zlabel" id="zlabel">100%</span>
  <button id="zoom-in" title="Zoom in">+</button>
  <div class="sep"></div>
  <button class="fit" id="fit" title="Fit to screen">Fit</button>
</div>

<div class="hint"><b>Drag</b> to pan · <b>Scroll</b> to zoom · <b>Click</b> a node to view / edit</div>

<aside class="detail" id="detail">
  <div class="dhead">
    <button class="close" id="detail-close">×</button>
    <div class="phase-tag" id="d-phase"></div>
    <h2 id="d-title"></h2>
    <div class="purpose" id="d-purpose"></div>
  </div>
  <div class="dbody" id="d-body"></div>
</aside>

<!-- Editor modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="mhead"><h2 id="m-title">Add node</h2><button class="x" id="m-close">×</button></div>
    <div class="mbody">
      <div class="field">
        <label>Title</label>
        <input id="f-title" placeholder="e.g. Customer Discovery Interviews" />
        <div class="err" id="f-title-err"></div>
      </div>
      <div class="grid2">
        <div class="field">
          <label>Lane</label>
          <select id="f-lane">
            <option value="flow">Lifecycle phase</option>
            <option value="gov">Governance (continuous)</option>
          </select>
        </div>
        <div class="field">
          <label id="f-phase-label">Phase</label>
          <select id="f-phase"></select>

/* ============================================================
   STATE  (persisted in localStorage)
   ============================================================ */
const STORE_KEY = "pm-process-map-v4";
let STATE = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return structuredClone(DEFAULT_DATA);
}
function saveState() { try { localStorage.setItem(STORE_KEY, JSON.stringify(STATE)); } catch (e) {} }
function byId(id) { return STATE.nodes.find(n => n.id === id); }
function normEdge(e) { return Array.isArray(e) ? { from:e[0], to:e[1], type:e[2]||null } : e; }
STATE.edges = STATE.edges.map(normEdge);

/* ============================================================
   RENDER
   ============================================================ */
const world = document.getElementById("world");
const svg = document.getElementById("edges");
let WORLD_W = 0, WORLD_H = 0;

function el(tag, cls, parent) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (parent) parent.appendChild(e);
  return e;
}

// Assign x,y to every node based on lane / phase / order
function layout() {
  const govCount = {};
  // flow nodes: stable order within phase
  const flowByPhase = {};
  STATE.nodes.filter(n => n.lane === "flow").forEach(n => {
    (flowByPhase[n.phase] = flowByPhase[n.phase] || []).push(n);
  });
  Object.values(flowByPhase).forEach(list => {
    list.sort((a,b) => (a.order||0) - (b.order||0));
    list.forEach((n, i) => { n._x = COL_X[n.phase]; n._y = NODE_START_Y + i*ROW_GAP; });
  });
  STATE.nodes.filter(n => n.lane === "gov").forEach(n => {
    const k = govCount[n.phase] = (govCount[n.phase]||0);
    n._x = COL_X[n.phase]; n._y = GOV_Y + k*GOV_GAP;
    govCount[n.phase] = k + 1;
  });
}

function nodeCard(n) {
  const isGov = n.lane === "gov";
  const phase = PHASE_BY_ID[n.phase];
  const color = isGov ? "var(--c-governance)" : phase.color;
  const node = el("div", "node" + (isGov ? " gov" : ""), world);
  node.dataset.id = n.id;
  node.dataset.phase = isGov ? "governance" : n.phase;
  node.dataset.ai = n.ai ? n.ai.level : "none";
  node.style.setProperty("--nc", color);
  node.style.left = n._x + "px";
  node.style.top = n._y + "px";

  if (n.ai) {
    const b = el("div", "ai-badge", node);
    b.style.setProperty("--aic", AI_LEVELS[n.ai.level].color);
    b.innerHTML = "✦ " + AI_LEVELS[n.ai.level].label;
  }
  const t = el("div", "ntitle" + (n.ai ? " has-badge" : ""), node);
  t.textContent = n.title;
  const meta = el("div","nmeta",node);
  if (n.owner)  { const o = el("span","chip owner",meta); o.textContent = n.owner; }
  if (n.cadence){ const c = el("span","chip",meta); c.textContent = n.cadence; }
  node.addEventListener("click", e => { e.stopPropagation(); openDetail(n.id); });
}

function buildMarkers() {
  const defs = svg.querySelector("defs");
  defs.innerHTML = "";
  const colors = {
    strategy:"#6366f1", discovery:"#06b6d4", planning:"#10b981", definition:"#f59e0b",
    delivery:"#f97316", launch:"#ec4899", growth:"#8b5cf6", measure:"#3b82f6",
    governance:"#64748b", loop:"#a78bfa"
  };
  Object.entries(colors).forEach(([k,c]) => {
    const m = document.createElementNS("http://www.w3.org/2000/svg","marker");
    m.setAttribute("id","arrow-"+k); m.setAttribute("viewBox","0 0 10 10");
    m.setAttribute("refX","8"); m.setAttribute("refY","5");
    m.setAttribute("markerWidth","7"); m.setAttribute("markerHeight","7");
    m.setAttribute("orient","auto-start-reverse");
    const path = document.createElementNS("http://www.w3.org/2000/svg","path");
    path.setAttribute("d","M0,0 L10,5 L0,10 z"); path.setAttribute("fill", c);
    m.appendChild(path); defs.appendChild(m);
  });
  return colors;
}

function geom(id) {
  const elm = world.querySelector(`.node[data-id="${CSS.escape(id)}"]`);
  if (!elm) return null;
  return { x: elm.offsetLeft, y: elm.offsetTop, w: elm.offsetWidth, h: elm.offsetHeight };
}

function computeBounds() {
  let maxX = 0, maxY = 0;
  world.querySelectorAll(".node, .phase-head").forEach(elm => {
    maxX = Math.max(maxX, elm.offsetLeft + elm.offsetWidth);
    maxY = Math.max(maxY, elm.offsetTop + elm.offsetHeight);
  });
  WORLD_W = maxX + 120; WORLD_H = maxY + 260;
  world.style.width = WORLD_W + "px"; world.style.height = WORLD_H + "px";
  svg.setAttribute("width", WORLD_W); svg.setAttribute("height", WORLD_H);
  svg.setAttribute("viewBox", `0 0 ${WORLD_W} ${WORLD_H}`);
}

function drawEdges(colors) {
  // clear existing paths (keep defs)
  svg.querySelectorAll("path.edge").forEach(p => p.remove());
  STATE.edges.forEach(e => {
    const { from, to, type } = e;
    const a = geom(from), b = geom(to);
    const fromNode = byId(from), toNode = byId(to);
    if (!a || !b || !fromNode || !toNode) return;
    const fromPhase = fromNode.lane === "gov" ? "governance" : fromNode.phase;
    const colorKey = type === "loop" ? "loop" : type === "gov" ? "governance" : fromPhase;
    let d;
    if (type === "loop") {
      const x1 = a.x + a.w/2, y1 = a.y + a.h, x2 = b.x + b.w/2, y2 = b.y + b.h, dip = WORLD_H - 150;
      d = `M ${x1} ${y1} C ${x1} ${dip}, ${x2} ${dip}, ${x2} ${y2}`;
    } else if (type === "gov") {
      const x1 = a.x + a.w/2, y1 = a.y + a.h, x2 = b.x + b.w/2, y2 = b.y, my = (y1+y2)/2;
      d = `M ${x1} ${y1} C ${x1} ${my}, ${x2} ${my}, ${x2} ${y2}`;
    } else if (b.x > a.x + 10) {
      const x1 = a.x + a.w, y1 = a.y + a.h/2, x2 = b.x, y2 = b.y + b.h/2, dx = Math.max(50,(x2-x1)*0.5);
      d = `M ${x1} ${y1} C ${x1+dx} ${y1}, ${x2-dx} ${y2}, ${x2} ${y2}`;
    } else if (Math.abs(b.x - a.x) <= 10) {
      const down = b.y > a.y, x1 = a.x + a.w/2, y1 = down ? a.y+a.h : a.y, x2 = b.x + b.w/2, y2 = down ? b.y : b.y+b.h, dy = (y2-y1)*0.5;
      d = `M ${x1} ${y1} C ${x1} ${y1+dy}, ${x2} ${y2-dy}, ${x2} ${y2}`;
    } else {
      const x1 = a.x, y1 = a.y + a.h/2, x2 = b.x + b.w, y2 = b.y + b.h/2, dx = Math.max(50,(x1-x2)*0.5);
      d = `M ${x1} ${y1} C ${x1-dx} ${y1}, ${x2+dx} ${y2}, ${x2} ${y2}`;
    }
    const path = document.createElementNS("http://www.w3.org/2000/svg","path");
    path.setAttribute("d", d);
    path.setAttribute("class", "edge" + (type ? " " + type : ""));
    path.setAttribute("stroke", colors[colorKey] || "#64748b");
    path.setAttribute("stroke-opacity", type === "gov" ? "0.5" : "0.62");
    path.setAttribute("marker-end", `url(#arrow-${colorKey})`);
    path.dataset.from = from; path.dataset.to = to;
    svg.appendChild(path);
  });
}

let MARKERS = null;
function render() {
  // wipe everything except the svg element
  world.querySelectorAll(".node, .phase-head, .lane-label").forEach(e => e.remove());

  laneLabel("Continuous · cross-cutting", 60, GOV_Y - 22);
  laneLabel("The product lifecycle  ·  flows left → right, then loops back", 60, HEAD_Y - 26);
  BANDS.forEach(b => {
    const h = el("div", "phase-head", world);
    h.style.setProperty("--phc", b.color);
    const first = COL_X[b.phases[0]], last = COL_X[b.phases[b.phases.length - 1]];
    h.style.left = first + "px"; h.style.top = HEAD_Y + "px";
    h.style.width = (last - first + NODE_W) + "px";
    el("div","ttl",h).textContent = b.title;
    el("div","sub",h).textContent = b.sub;
  });

  layout();
  STATE.nodes.forEach(nodeCard);

  computeBounds();
  if (!MARKERS) MARKERS = buildMarkers();
  drawEdges(MARKERS);
  applyDisplay();
  if (currentId) highlightSelected(currentId);
}
function laneLabel(text, x, y) {
  const l = el("div", "lane-label", world);
  l.textContent = text; l.style.left = x + "px"; l.style.top = y + "px";
}

/* ============================================================
   PAN / ZOOM
   ============================================================ */
const stage = document.getElementById("stage");
const zlabel = document.getElementById("zlabel");
let view = { x: 0, y: 0, k: 1 };
const MIN_K = 0.18, MAX_K = 2.2;
function applyView() {
  world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.k})`;
  zlabel.textContent = Math.round(view.k * 100) + "%";
}
function fit() {
  const vw = stage.clientWidth, vh = stage.clientHeight, pad = 70;
  const k = Math.min((vw-pad*2)/WORLD_W, (vh-pad*2)/WORLD_H, MAX_K);
  view.k = Math.max(MIN_K, k);
  view.x = (vw - WORLD_W*view.k)/2; view.y = (vh - WORLD_H*view.k)/2 + 10;
  applyView();
}
function zoomAt(cx, cy, factor) {
  const newK = Math.min(MAX_K, Math.max(MIN_K, view.k*factor));
  const wx = (cx-view.x)/view.k, wy = (cy-view.y)/view.k;
  view.k = newK; view.x = cx - wx*newK; view.y = cy - wy*newK; applyView();
}
stage.addEventListener("wheel", e => {
  e.preventDefault();
  const rect = stage.getBoundingClientRect();
  zoomAt(e.clientX-rect.left, e.clientY-rect.top, e.deltaY < 0 ? 1.12 : 1/1.12);
}, { passive:false });
let dragging=false, last=null, moved=false;
stage.addEventListener("pointerdown", e => {
  if (e.target.closest(".node")) return;
  dragging=true; moved=false; last={x:e.clientX,y:e.clientY};
  stage.classList.add("dragging"); stage.setPointerCapture(e.pointerId);
});
stage.addEventListener("pointermove", e => {
  if (!dragging) return;
  view.x += e.clientX-last.x; view.y += e.clientY-last.y;
  last={x:e.clientX,y:e.clientY}; moved=true; applyView();
});
function endDrag(){ dragging=false; stage.classList.remove("dragging"); }
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);
stage.addEventListener("click", e => { if ((e.target===stage||e.target===world) && !moved) closeDetail(); });
document.getElementById("zoom-in").onclick = () => zoomAt(stage.clientWidth/2, stage.clientHeight/2, 1.2);
document.getElementById("zoom-out").onclick = () => zoomAt(stage.clientWidth/2, stage.clientHeight/2, 1/1.2);
document.getElementById("fit").onclick = fit;

let activeBand = null, activeAi = null, lensOn = false;
const legendItems = document.getElementById("legend-items");
BANDS.forEach(b => {

  const sw = el("span","swatch",item); sw.style.background = b.color; sw.style.color = b.color;
  const t = document.createElement("span"); t.textContent = b.title; item.appendChild(t);

const aiItems = document.getElementById("ai-items");
Object.entries(AI_LEVELS).forEach(([key,info]) => {
  const item = el("div","item",aiItems); item.dataset.ai = key;
  const sw = el("span","swatch",item); sw.style.background = info.color; sw.style.color = info.color;

});
document.getElementById("legend-reset").onclick = () => { activeBand=null; activeAi=null; syncLegend(); applyDisplay(); };
document.getElementById("lens-toggle").onclick = () => { lensOn = !lensOn; syncLegend(); applyDisplay(); };

function syncLegend() {
  legendItems.querySelectorAll(".item").forEach(it => it.classList.toggle("active", it.dataset.band===activeBand));
  aiItems.querySelectorAll(".item").forEach(it => it.classList.toggle("active", it.dataset.ai===activeAi));
  document.getElementById("lens-toggle").classList.toggle("on", lensOn);
}
function applyDisplay() {
  world.classList.toggle("lens", lensOn);
  const bandPhases = activeBand ? BANDS.find(b => b.idx===activeBand).phases : null;
  world.querySelectorAll(".node").forEach(n => {
    const ph = n.dataset.phase, ai = n.dataset.ai;
    let show = true;
    if (bandPhases) show = show && bandPhases.includes(ph);
    if (activeAi) show = show && (ai === activeAi);
    n.classList.toggle("dimmed", !show);
  });
  svg.querySelectorAll(".edge").forEach(ed => {
    const a = world.querySelector(`.node[data-id="${CSS.escape(ed.dataset.from)}"]`);
    const b = world.querySelector(`.node[data-id="${CSS.escape(ed.dataset.to)}"]`);
    const hidden = !a || !b || a.classList.contains("dimmed") || b.classList.contains("dimmed");
    ed.classList.toggle("dimmed", hidden);
  });
}

   DETAIL PANEL

const detail = document.getElementById("detail");
let currentId = null;
function highlightSelected(id) {
  world.querySelectorAll(".node").forEach(e => e.classList.toggle("selected", e.dataset.id===id));
}
function openDetail(id) {
  const n = byId(id); if (!n) return;
  currentId = id;
  const isGov = n.lane === "gov";
  const phase = PHASE_BY_ID[n.phase];
  const band = BAND_BY_PHASE[n.phase];
  const color = isGov ? "var(--c-governance)" : phase.color;
  const phaseName = isGov ? "Continuous · Cross-cutting" : `Phase ${band.idx} · ${band.title}`;
  detail.style.setProperty("--dc", color);
  document.getElementById("d-phase").textContent = phaseName;
  document.getElementById("d-title").textContent = n.title;
  document.getElementById("d-purpose").textContent = n.purpose || "";

  const body = document.getElementById("d-body");
  const list = (title, arr) => (arr && arr.length) ? `<div class="sect"><h4>${title}</h4><ul>${arr.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>` : "";
  const tags = (title, arr) => (arr && arr.length) ? `<div class="sect"><h4>${title}</h4><div class="tags">${arr.map(i=>`<span>${esc(i)}</span>`).join("")}</div></div>` : "";
  let aiBlock;
  if (n.ai) {
    aiBlock = `<div class="ai-card" style="--aic:${AI_LEVELS[n.ai.level].color}">
        <div class="ai-h"><span class="ai-spark">✦</span><span class="ai-lvl">AI-enabled · ${AI_LEVELS[n.ai.level].label}</span></div>
        <div class="ai-how">${esc(n.ai.how || "")}</div></div>`;
  } else {
    aiBlock = `<div class="ai-none">Not AI-enabled — primarily a human-led process.</div>`;
  }
  body.innerHTML =
      `<div class="row"><div class="k">Owner</div><div class="v">${esc(n.owner||"—")}</div></div>
       <div class="row"><div class="k">Cadence</div><div class="v">${esc(n.cadence||"—")}</div></div>`
    + aiBlock
    + list("Key activities", n.activities)
    + list("Inputs", n.inputs)
    + list("Outputs", n.outputs)
    + tags("Tools", n.tools)
    + `<div class="actions">
         <button class="edit" id="d-edit">Edit</button>
         <button class="del" id="d-delete">Delete</button>
       </div>
       <div class="nav">
         <button id="d-prev">← Previous</button>
         <button id="d-next">Next →</button>
       </div>`;
  document.getElementById("d-edit").onclick = () => openEditor(id);
  document.getElementById("d-delete").onclick = () => deleteNode(id);
  document.getElementById("d-prev").onclick = () => step(-1);
  document.getElementById("d-next").onclick = () => step(1);

  detail.classList.add("open");
  highlightSelected(id);
}
function step(dir) {
  const order = STATE.nodes.map(n => n.id);
  const i = order.indexOf(currentId);
  openDetail(order[(i + dir + order.length) % order.length]);
}
function closeDetail() {
  detail.classList.remove("open"); currentId = null;
  world.querySelectorAll(".node.selected").forEach(e => e.classList.remove("selected"));
}
document.getElementById("detail-close").onclick = closeDetail;

/* ============================================================
   EDITOR (add / edit / delete)
   ============================================================ */
const overlay = document.getElementById("overlay");
let editingId = null;
const F = id => document.getElementById(id);

// populate phase select once
PHASES.forEach(p => {
  const o = document.createElement("option"); o.value = p.id; o.textContent = `${p.idx} · ${p.title}`;
  F("f-phase").appendChild(o);
});
F("f-lane").onchange = () => {
  F("f-phase-label").textContent = F("f-lane").value === "gov" ? "Align under phase" : "Phase";
};

function fillConnectionSelects(excludeId) {
  ["f-into","f-from"].forEach(selId => {
    const sel = F(selId); sel.innerHTML = "";
    PHASES.forEach(p => {
      const group = document.createElement("optgroup"); group.label = p.title;
      STATE.nodes.filter(n => n.lane==="flow" && n.phase===p.id && n.id!==excludeId).forEach(n => {
        const o = document.createElement("option"); o.value = n.id; o.textContent = n.title; group.appendChild(o);
      });
      if (group.children.length) sel.appendChild(group);
    });
    const govNodes = STATE.nodes.filter(n => n.lane==="gov" && n.id!==excludeId);
    if (govNodes.length) {
      const group = document.createElement("optgroup"); group.label = "Governance";
      govNodes.forEach(n => { const o=document.createElement("option"); o.value=n.id; o.textContent=n.title; group.appendChild(o); });
      sel.appendChild(group);
    }
  });
}
function setMulti(selId, values) {
  const set = new Set(values);
  Array.from(F(selId).options).forEach(o => o.selected = set.has(o.value));
}
function getMulti(selId) { return Array.from(F(selId).selectedOptions).map(o => o.value); }
const toLines = s => s.split("\n").map(x => x.trim()).filter(Boolean);
const fromLines = arr => (arr||[]).join("\n");

function openEditor(id) {
  editingId = id || null;
  const adding = !id;
  F("m-title").textContent = adding ? "Add node" : "Edit node";
  F("m-delete").hidden = adding;
  F("f-title-err").textContent = "";
  fillConnectionSelects(id);

  const n = adding ? null : byId(id);
  F("f-title").value    = n ? n.title : "";
  F("f-lane").value     = n ? n.lane : "flow";
  F("f-phase").value    = n ? n.phase : PHASES[0].id;
  F("f-phase-label").textContent = F("f-lane").value === "gov" ? "Align under phase" : "Phase";
  F("f-owner").value    = n ? (n.owner||"") : "";
  F("f-cadence").value  = n ? (n.cadence||"") : "";
  F("f-purpose").value  = n ? (n.purpose||"") : "";
  F("f-activities").value = n ? fromLines(n.activities) : "";
  F("f-tools").value    = n ? fromLines(n.tools) : "";
  F("f-inputs").value   = n ? fromLines(n.inputs) : "";
  F("f-outputs").value  = n ? fromLines(n.outputs) : "";
  F("f-ailevel").value  = n && n.ai ? n.ai.level : "";
  F("f-aihow").value    = n && n.ai ? (n.ai.how||"") : "";

  if (n) {
    setMulti("f-into", STATE.edges.filter(e => !e.type && e.from===id).map(e => e.to));
    setMulti("f-from", STATE.edges.filter(e => !e.type && e.to===id).map(e => e.from));
  } else { setMulti("f-into", []); setMulti("f-from", []); }

  overlay.classList.add("open");
  setTimeout(() => F("f-title").focus(), 50);
}
function closeEditor() { overlay.classList.remove("open"); editingId = null; }
F("m-close").onclick = closeEditor;
F("m-cancel").onclick = closeEditor;
overlay.addEventListener("click", e => { if (e.target === overlay) closeEditor(); });

function slug(s) {
  return (s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,24) || "node")
    + "-" + Date.now().toString(36).slice(-4);
}

F("m-save").onclick = () => {
  const title = F("f-title").value.trim();
  if (!title) { F("f-title-err").textContent = "Title is required."; return; }
  const lane = F("f-lane").value;
  const phase = F("f-phase").value;
  const aiLevel = F("f-ailevel").value;
  const ai = aiLevel ? { level: aiLevel, how: F("f-aihow").value.trim() } : null;
  const fields = {
    title, lane, phase, owner: F("f-owner").value.trim(), cadence: F("f-cadence").value.trim(),
    purpose: F("f-purpose").value.trim(),
    activities: toLines(F("f-activities").value), tools: toLines(F("f-tools").value),
    inputs: toLines(F("f-inputs").value), outputs: toLines(F("f-outputs").value), ai,
  };

  let id = editingId;
  if (editingId) {
    Object.assign(byId(editingId), fields);
  } else {
    id = slug(title);
    const order = Math.max(-1, ...STATE.nodes.filter(n => n.lane===lane && n.phase===phase).map(n => n.order||0)) + 1;
    STATE.nodes.push({ id, order, ...fields });
  }
  // rebuild this node's normal connections from the form
  STATE.edges = STATE.edges.filter(e => e.type || (e.from!==id && e.to!==id));
  getMulti("f-into").forEach(to => { if (to!==id) STATE.edges.push({ from:id, to, type:null }); });
  getMulti("f-from").forEach(from => { if (from!==id) STATE.edges.push({ from, to:id, type:null }); });

  saveState(); render(); closeEditor(); openDetail(id);
  toast(editingId ? "Node updated" : "Node added");
};
F("m-delete").onclick = () => deleteNode(editingId);

function deleteNode(id) {
  const n = byId(id); if (!n) return;
  if (!confirm(`Delete "${n.title}"? This also removes its connections.`)) return;
  STATE.nodes = STATE.nodes.filter(x => x.id !== id);
  STATE.edges = STATE.edges.filter(e => e.from !== id && e.to !== id);
  saveState(); closeEditor(); closeDetail(); render();
  toast("Node deleted");
}

document.getElementById("add-node").onclick = () => openEditor(null);

/* ============================================================
   IMPORT / EXPORT / RESET
   ============================================================ */
document.getElementById("export-btn").onclick = () => {
  const blob = new Blob([JSON.stringify(STATE, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "pm-process-map.json"; a.click();
  URL.revokeObjectURL(a.href); toast("Exported JSON");
};
document.getElementById("import-btn").onclick = () => document.getElementById("import-file").click();
document.getElementById("import-file").onchange = e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!Array.isArray(data.nodes) || !Array.isArray(data.edges)) throw new Error("bad shape");
      STATE = data; STATE.edges = STATE.edges.map(normEdge);
      saveState(); closeDetail(); render(); fit(); toast("Imported map");
    } catch (err) { toast("Import failed — invalid file"); }
    e.target.value = "";
  };
  reader.readAsText(file);
};
document.getElementById("reset-btn").onclick = () => {
  if (!confirm("Reset to the default map? Your changes will be lost.")) return;
  STATE = structuredClone(DEFAULT_DATA); STATE.edges = STATE.edges.map(normEdge);
  saveState(); closeDetail(); render(); fit(); toast("Reset to default");
};

/* ============================================================
   MISC
   ============================================================ */
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }
let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}
document.addEventListener("keydown", e => {
  if (overlay.classList.contains("open")) { if (e.key === "Escape") closeEditor(); return; }
  if (e.key === "Escape") closeDetail();
  else if (currentId && e.key === "ArrowRight") step(1);
  else if (currentId && e.key === "ArrowLeft") step(-1);
});

/* init */
render(); fit();
window.addEventListener("resize", () => { if (!currentId && !overlay.classList.contains("open")) fit(); });
</script>
</body>
</html>
